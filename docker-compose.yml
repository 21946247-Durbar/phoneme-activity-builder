services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: phoneme-activity-builder
    container_name: phoneme-builder
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
    volumes:
      - phoneme-prisma:/app/prisma
    restart: unless-stopped

volumes:
  phoneme-prisma:
